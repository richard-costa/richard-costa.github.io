  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#31251f"/><stop offset="1" stop-color="#100f0f"/></linearGradient>
  <linearGradient id="cup" x2="1" y2=".2"><stop stop-color="#705c48"/><stop offset=".5" stop-color="#ba9d7a"/><stop offset="1" stop-color="#42352e"/></linearGradient>
