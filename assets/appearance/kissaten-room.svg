  <linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#542e29"/><stop offset=".4" stop-color="#9c5240"/><stop offset=".8" stop-color="#c18a67"/><stop offset="1" stop-color="#3f3e3a"/></linearGradient>
