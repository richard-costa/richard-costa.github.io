# Site-wide Quarto configuration.
# Page-specific options belong in the page itself or in a directory _metadata.yml.
project:
  type: website

website:
  title: "Richard Costa"
  site-url: "https://richard-costa.github.io"

  navbar:
    title: "richard.costa_"
    right:
      - href: notes/index.qmd
        text: notes
      - href: posts.qmd
        text: posts
      - href: https://github.com/richard-costa
        text: github

  page-footer:
    left: "Richard Costa"
    right: "Built with Quarto"

format:
  html:
    theme: theme.scss
    toc: true
    smooth-scroll: true
    code-copy: true

# Keep equation references compact: "(1)" instead of "Equation 1".
# Equation numbering/cross-references remain Quarto-native.
crossref:
  eq-prefix: ""
