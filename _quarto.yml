# Site-wide Quarto configuration.
# Page-specific options belong in the page itself or in a directory _metadata.yml.
project:
  type: website
  pre-render:
    - _scripts/generate_writing_listing.py
  post-render:
    - _scripts/generate_changelog.py
    - _scripts/generate_notes_feed.py
    - _scripts/generate_giscus_theme.py
  resources:
    - robots.txt
    - humans.txt
    - site.js
    - data/equations.json
    - data/home-media.json
    - assets/home-media/**

website:
  title: "Richard Costa"
  site-url: "https://richard-costa.github.io"
  description: "Projects, essays, notes, and shorts by Richard Costa."

  navbar:
    title: "richard.costa_ / são paulo"
    right:
      - href: writing.qmd
        text: writing
      - href: projects.qmd
        text: projects
      - href: now.qmd
        text: now
      - text: more
        menu:
          - href: bookmarks.qmd
            text: bookmarks
          - href: changelog.qmd
            text: changelog

  page-footer:
    left: "Richard Costa"
    right: "Built with Quarto · [humans.txt](/humans.txt)"

format:
  html:
    theme: theme.scss
    toc: true
    smooth-scroll: true
    code-copy: true
    include-after-body: _includes/site-scripts.html

# Keep equation references compact: "(1)" instead of "Equation 1".
# Equation numbering/cross-references remain Quarto-native.
crossref:
  eq-prefix: ""
